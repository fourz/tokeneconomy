general:
  logLevel: WARNING

database:
  # shared: borrow RVNKCore's HikariCP pool (RVNKCore must be present — hard fail if absent)
  # standalone: own pool using storage.mysql.* / storage.sqlite.* config (works without RVNKCore)
  mode: standalone

economy:
  currencyNameSingular: Wizbuck
  currencyNamePlural: Wizbucks
  currencySymbol: 'W'
  migrate_old_economy: false
  payCommandInsufficientFundsMessage: "You do not have enough {currencyName} to pay that amount."
  payCommandInvalidAmountMessage: "Invalid amount. Please enter a valid number."
  payCommandInvalidPlayerMessage: "Invalid player. Please enter a valid player name."
  payCommandSuccessMessage: "You have paid {amount} {currencyName} to {player}."
  payCommandReceiveMessage: "{player} has paid you {amount} {currencyName}."
  payCommandReceiveMessageOffline: "{player} has paid you {amount} {currencyName} while you were offline."
  payCommandReceiveMessageSelf: "You cannot pay yourself."
  payCommandNoPermissionMessage: "{currencyName} are non-transferable between players."

# PlaceholderAPI expansion %tokeneconomy_*% (#2109). Registered only when PlaceholderAPI is enabled.
# Values come from an in-memory cache - a placeholder never queries the database.
# Missing keys fall back to the defaults shown here, so an existing config.yml needs no edit.
placeholders:
  # Returned for an unknown placeholder, an offline/unknown player, or a balance not loaded yet
  fallback: ''
  # Returned while the economy database is unavailable - never 0, so a scoreboard does not
  # imply the player is broke
  unavailable: '-'
  # Rows kept for %tokeneconomy_top_<n>_*% and %tokeneconomy_rank% (read at enable only)
  topSize: 100
  # Seconds between cache refreshes of online balances and the top list (read at enable only)
  refreshSeconds: 30

storage:
  type: sqlite
  migrate_from_mysql: false
  migrate_from_sqlite: false
  migration_status: none
  mysql:
    host: localhost
    port: 3306
    username: root
    password: ''
    useSSL: false
    database:
    tablePrefix: token_
    connectionTimeout: 5000
    maxRetries: 3
    retryDelay: 2000
  sqlite:
    database: data.db
    # Table prefix for shared database hosting (e.g., "token_" creates "token_economy")
    tablePrefix: ""